<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>array box</title>
  </head>
  <body>
    <template id="array-box-template">
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        /* The user's lists drawn with their own tile artwork, on the right of the frame: five
           yellow tiles (assets/tile.png) rain down with a squash-and-stretch landing, the white
           index numbers 0-4 appear above them, each value is a black glyph cut from the user's
           0-9 sheet (assets/dig-N.png) and lands on its tile, then the variable and a cyan arrow
           into the first tile - the arrow style of the approved memory videos.
           Row A is the source list (lst), row B the squares (res). */
        .ab-tile {
          position: absolute; opacity: 0;
          background-image: url("assets/tile.png");
          background-size: 100% 100%;
          transform-origin: 50% 100%;   /* it lands on its own bottom edge */
        }
        .ab-dig { position: absolute; opacity: 0; background-size: 100% 100%; transform-origin: 50% 100%; }
        .ab-dig div { position: absolute; background-size: 100% 100%; }
        .ab-t {
          position: absolute; opacity: 0;
          font-family: "JetBrains Mono", Consolas, monospace; font-weight: 500;
          white-space: pre; color: #ffffff;
        }
        .ab-idx { text-align: center; font-size: 34px; line-height: 42px; }
        /* the squaring shown in the gap between the two lists, one column at a time */
        .ab-mul { text-align: center; font-size: 38px; line-height: 48px; }
        /* a pair - the value and its cube - written straight onto a wider tile */
        .ab-pair {
          text-align: center; font-size: 36px; line-height: 48px;
          color: #171717; font-weight: 700; transform-origin: 50% 100%;
        }
        /* one character of a string, written straight onto its own small tile */
        .ab-chr {
          text-align: center; font-size: 44px; line-height: 56px;
          color: #171717; font-weight: 700; transform-origin: 50% 100%;
        }
        .ab-ring2 {
          position: absolute; opacity: 0;
          border: 4px solid #ffae3d; border-radius: 22px;
          box-shadow: 0 0 18px rgba(255, 174, 61, 0.75), inset 0 0 12px rgba(255, 174, 61, 0.35);
        }
        .ab-ring { position: absolute; opacity: 0; border: 4px solid #4fd1ff; border-radius: 22px; box-shadow: 0 0 18px rgba(79, 209, 255, 0.75), inset 0 0 12px rgba(79, 209, 255, 0.35); }
        #ab-lst, #ab-res, #ab-lst2, #ab-res2, #ab-res3, #ab-sv, #ab-rv, #ab-l1, #ab-l2 { text-align: right; font-size: 38px; line-height: 48px; opacity: 1; }
        .ab-arrow { position: absolute; left: 0; top: 0; overflow: visible; }
      </style>

      <div data-hf-id="hf-7b8p" id="root" data-composition-id="array-box" data-width="1920" data-height="1080" data-duration="659"><div data-hf-id="hf-5xk8" id="ab-stage" data-layout-allow-overflow="true" style="position: absolute; inset: 0;"></div></div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          var CHAR = 0.075;
          var root = document.getElementById("root"), stage = document.getElementById("ab-stage");
          var tl = gsap.timeline({ paused: true });

          // Layout: five tiles ending 32px from the right edge.
          var TW = 84, TH = 83, GAP = 11, N = 5;
          var X0 = 1888 - (N * TW + (N - 1) * GAP);
          // Where each glyph sits on its tile, as a fraction of the tile (measured off the sheet).
          var DIG = { 0: [0.190, 0.1447, 0.600, 0.7270], 1: [0.2458, 0.1447, 0.4120, 0.7138],
                      2: [0.2133, 0.1447, 0.580, 0.7138], 3: [0.2267, 0.1480, 0.5667, 0.7237],
                      4: [0.1881, 0.1480, 0.6337, 0.7105], 5: [0.2067, 0.1447, 0.600, 0.7368],
                      6: [0.1960, 0.1414, 0.6146, 0.7401], 7: [0.2400, 0.1316, 0.5733, 0.7500],
                      8: [0.1900, 0.1349, 0.6267, 0.7467], 9: [0.1947, 0.1283, 0.6172, 0.7500] };
          // A value's glyphs on one tile. One digit keeps its own place on the sheet; two digits
          // are shrunk to 0.62 and centred as a pair, so every two-digit value reads the same size.
          function glyphs(value, uniform) {
            var ds = String(value).split("").map(Number);
            if (ds.length === 1 && !uniform) {
              var o = DIG[ds[0]];
              return [{ d: ds[0], x: o[0], y: o[1], w: o[2], h: o[3] }];
            }
            var k = 0.72, G = 0.03, CY = 0.505, out = [];
            var total = ds.reduce(function (a, d) { return a + DIG[d][2] * k; }, 0) + G * (ds.length - 1);
            var x = (1 - total) / 2;
            ds.forEach(function (d) {
              var w = DIG[d][2] * k, h = DIG[d][3] * k;
              out.push({ d: d, x: x, y: CY - h / 2, w: w, h: h });
              x += w + G;
            });
            return out;
          }

          function add(id, cls, css, text) {
            var el = document.createElement("div");
            if (id) el.id = id;
            el.className = cls;
            el.style.cssText = css;
            if (text !== undefined) el.textContent = text;
            stage.appendChild(el);
            return el;
          }
          // One list: index numbers, tiles, and the value glyphs sitting on them.
          function buildRow(p, values, ty, uniform) {
            values.forEach(function (v, i) {
              var x = X0 + i * (TW + GAP);
              add(p + "i" + i, "ab-t ab-idx", "left: " + x + "px; top: " + (ty - 50) + "px; width: " + TW + "px;", String(i));
              add(p + "t" + i, "ab-tile", "left: " + x + "px; top: " + ty + "px; width: " + TW + "px; height: " + TH + "px;");
              var g = glyphs(v, uniform);
              if (g.length === 1) {
                add(p + "v" + i, "ab-dig", "left: " + (x + g[0].x * TW) + "px; top: " + (ty + g[0].y * TH) + "px; width: " + (g[0].w * TW) +
                  "px; height: " + (g[0].h * TH) + "px; background-image: url(\"assets/dig-" + g[0].d + ".png\");");
                return;
              }
              var x0 = Math.min.apply(null, g.map(function (b) { return b.x; }));
              var y0 = Math.min.apply(null, g.map(function (b) { return b.y; }));
              var x1 = Math.max.apply(null, g.map(function (b) { return b.x + b.w; }));
              var y1 = Math.max.apply(null, g.map(function (b) { return b.y + b.h; }));
              var wrap = add(p + "v" + i, "ab-dig", "left: " + (x + x0 * TW) + "px; top: " + (ty + y0 * TH) +
                "px; width: " + ((x1 - x0) * TW) + "px; height: " + ((y1 - y0) * TH) + "px;");
              g.forEach(function (b) {
                var el = document.createElement("div");
                el.style.cssText = "left: " + ((b.x - x0) * TW) + "px; top: " + ((b.y - y0) * TH) + "px; width: " + (b.w * TW) +
                  "px; height: " + (b.h * TH) + "px; background-image: url(\"assets/dig-" + b.d + ".png\");";
                wrap.appendChild(el);
              });
            });
          }
          // The cyan arrow of the approved style, from the variable into the first tile.
          var SVG_OPEN = '<svg id="ID" class="ab-arrow" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">' +
            '<defs><mask id="ID-m" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">' +
            '<path id="ID-rv" d="M AX0 AY H AX1" fill="none" stroke="#ffffff" stroke-width="14" /></mask></defs>' +
            '<g style="filter: drop-shadow(0 0 6px rgba(79, 209, 255, 0.65));">' +
            '<path d="M AX0 AY H AX1" fill="none" stroke="#4fd1ff" stroke-width="4" stroke-linecap="round" mask="url(#ID-m)" />' +
            '<polygon id="ID-hd" points="HDX,AY HBX,HUY HBX,HLY" fill="#4fd1ff" opacity="0" /></g></svg>';
          function mkArrow(id, ay) {
            var AX0 = X0 - 100, AX1 = X0 - 28;
            stage.insertAdjacentHTML("beforeend", '<svg id="' + id + '" class="ab-arrow" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">' +
              '<defs><mask id="' + id + '-m" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">' +
              '<path id="' + id + '-rv" d="M ' + AX0 + ' ' + ay + ' H ' + AX1 + '" fill="none" stroke="#ffffff" stroke-width="14" /></mask></defs>' +
              '<g style="filter: drop-shadow(0 0 6px rgba(79, 209, 255, 0.65));">' +
              '<path d="M ' + AX0 + ' ' + ay + ' H ' + AX1 + '" fill="none" stroke="#4fd1ff" stroke-width="4" stroke-linecap="round" mask="url(#' + id + '-m)" />' +
              '<polygon id="' + id + '-hd" points="' + (AX1 + 16) + ',' + ay + ' ' + (AX1 - 4) + ',' + (ay - 11) + ' ' + (AX1 - 4) + ',' + (ay + 11) + '" fill="#4fd1ff" opacity="0" /></g></svg>');
            stage.lastChild.setAttribute("data-layout-allow-overflow", "true");
          }

          // Row A: the source list, at the top. Row B: its squares, below it.
          var A = [5, 7, 1, 2, 4], B = [25, 49, 1, 4, 16], TYA = 150, TYB = 400, TYM = 290;
          buildRow("ab-a", A, TYA, true);
          buildRow("ab-b", B, TYB, true);
          // the variable sits right against the arrow, which reaches into the first tile
          add("ab-lst", "ab-t", "left: " + (X0 - 296) + "px; top: " + (TYA + TH / 2 - 24) + "px; width: 160px;", "lst");
          add("ab-res", "ab-t", "left: " + (X0 - 296) + "px; top: " + (TYB + TH / 2 - 24) + "px; width: 160px;", "res");
          mkArrow("ab-ar", Math.round(TYA + TH / 2));
          mkArrow("ab-br", Math.round(TYB + TH / 2));
          // Between the lists: i x i for each column, and a ring that moves along the results.
          A.forEach(function (v, i) {
            var x = X0 + i * (TW + GAP);
            add("ab-m" + i, "ab-t ab-mul", "left: " + x + "px; top: " + TYM + "px; width: " + TW + "px;", v + " × " + v);
          });

          // ---- the moves ----
          // A tile rains down and lands: it stretches as it falls, squashes on impact, springs back.
          function rain(id, at) {
            var s = "#" + id;
            tl.set(s, { scaleX: 0.82, scaleY: 1.3 }, 0);
            tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, at);
            tl.fromTo(s, { y: -340 }, { y: 0, duration: 0.42, ease: "power2.in", immediateRender: false }, at);
            tl.fromTo(s, { scaleX: 0.82, scaleY: 1.3 }, { scaleX: 1.32, scaleY: 0.7, duration: 0.09, ease: "power2.out", immediateRender: false }, at + 0.42);
            tl.fromTo(s, { scaleX: 1.32, scaleY: 0.7 }, { scaleX: 1, scaleY: 1, duration: 0.7, ease: "elastic.out(1, 0.45)", immediateRender: false }, at + 0.51);
          }
          // A value drops onto its tile; the tile gives under it, then settles.
          function drop(id, tile, at) {
            var s = "#" + id;
            tl.set(s, { scaleX: 0.86, scaleY: 1.24 }, 0);
            tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out", immediateRender: false }, at);
            tl.fromTo(s, { y: -240 }, { y: 0, duration: 0.34, ease: "power2.in", immediateRender: false }, at);
            tl.fromTo(s, { scaleX: 0.86, scaleY: 1.24 }, { scaleX: 1.2, scaleY: 0.78, duration: 0.08, ease: "power2.out", immediateRender: false }, at + 0.34);
            tl.fromTo(s, { scaleX: 1.2, scaleY: 0.78 }, { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1, 0.5)", immediateRender: false }, at + 0.42);
            tl.fromTo("#" + tile, { scaleX: 1, scaleY: 1 }, { scaleX: 1.1, scaleY: 0.88, duration: 0.08, ease: "power2.out", immediateRender: false }, at + 0.34);
            tl.fromTo("#" + tile, { scaleX: 1.1, scaleY: 0.88 }, { scaleX: 1, scaleY: 1, duration: 0.55, ease: "elastic.out(1, 0.5)", immediateRender: false }, at + 0.42);
          }
          // The pop and type-on of the approved style.
          function pop(id, at, dur) {
            var el = document.getElementById(id);
            tl.fromTo(el, { scale: 0.3, transformOrigin: "50% 50%" }, { scale: 1, duration: dur || 0.5, ease: "back.out(1.6)" }, at);
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, at);
          }
          // ---- one ring per row: it glides along instead of popping in and out ----
          function walker(id, cls, x0, ty, w, h, extra) {
            return add(id, cls, "left: " + (x0 - 8) + "px; top: " + (ty - 8) + "px; width: " + (w + 16) +
              "px; height: " + (h + 16) + "px;" + (extra || ""));
          }
          function ringOn(sel, x, at) {
            tl.set(sel, { x: x, visibility: "visible" }, at - 0.3);
            tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, at - 0.3);
          }
          function ringTo(sel, from, to, at, dur) {
            var d = dur || 0.5;
            tl.fromTo(sel, { x: from }, { x: to, duration: d, ease: "power2.inOut", immediateRender: false }, at - d);
          }
          function ringOff(sel, at) {
            tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.inOut", immediateRender: false }, at);
            tl.set(sel, { visibility: "hidden" }, at + 0.32);   // it is gone for good, not just clear
          }
          // the slot it arrives on gives a little under it - the only lift left in the move
          function bump(sels, at) {
            sels.forEach(function (sl) {
              tl.fromTo(sl, { scaleX: 1, scaleY: 1 }, { scaleX: 1.1, scaleY: 1.1, duration: 0.14, ease: "power2.out", immediateRender: false }, at);
              tl.fromTo(sl, { scaleX: 1.1, scaleY: 1.1 }, { scaleX: 1, scaleY: 1, duration: 0.65, ease: "elastic.out(1, 0.45)", immediateRender: false }, at + 0.14);
            });
          }
          function type(id, at) {
            var el = document.getElementById(id), text = el.textContent;
            el.textContent = "";
            for (var i = 0; i < text.length; i++) {
              var span = document.createElement("span");
              span.textContent = text.charAt(i);
              el.appendChild(span);
              tl.fromTo(span, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: "none" }, at);
              at += CHAR;
            }
            return at;
          }
          function draw(id, at) {
            var path = document.getElementById(id + "-rv"), len = Math.ceil(path.getTotalLength()) + 2;
            path.setAttribute("stroke-dasharray", len + " " + len);
            tl.fromTo(path, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power1.inOut" }, at);
            tl.fromTo("#" + id + "-hd", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out", immediateRender: false }, at + 0.6);
          }
          // Every list is built the same way: the tiles rain in, the indices appear, the values land.
          function fill(p, values, t0) {
            values.forEach(function (v, i) { rain(p + "t" + i, t0 + i * 0.18); });
            values.forEach(function (v, i) { pop(p + "i" + i, t0 + 2.0 + i * 0.22); });
            values.forEach(function (v, i) { drop(p + "v" + i, p + "t" + i, t0 + 3.5 + i * 0.3); });
          }

          // ---- Part 1: the source list ----
          fill("ab-a", A, 0.3);
          type("ab-lst", 6.0);
          draw("ab-ar", 6.6);

          // ---- Part 2: the code is written (code-window.html, 10.0 - 12.5), then the squares ----
          fill("ab-b", B, 13.2);
          type("ab-res", 19.4);
          draw("ab-br", 20.0);

          // The ring travels left to right along the results, one slot at a time.
          walker("ab-rb", "ab-ring", X0, TYB, TW, TH);
          function highlight(i, at) {
            if (i === 0) ringOn("#ab-rb", 0, at);
            else ringTo("#ab-rb", (i - 1) * (TW + GAP), i * (TW + GAP), at);
            bump(["#ab-bt" + i, "#ab-bv" + i], at);
          }

          // ---- Part 4: where each result comes from - 5 x 5 is 25, then 7 x 7 is 49, and so on.
          // Only the one being worked out is on screen: each sum clears as the next appears.
          var M0 = 30.0, STEP = 1.4;
          A.forEach(function (v, i) {
            var at = M0 + i * STEP;
            pop("ab-m" + i, at, 0.45);
            tl.fromTo("#ab-m" + i, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.inOut", immediateRender: false }, at + STEP - 0.1);
            highlight(i, at + 0.45);
          });
          ringOff("#ab-rb", M0 + 4 * STEP + 0.9);

          // ---- Part 7: the lists come back, and res is rebuilt from the even values only ----
          // The squares row is dropped while the frame is dark; the source list is untouched,
          // so the composition simply fades back in around it.
          var RESET7 = 73.9, BACK7 = 74.8;
          var OLD7 = ["ab-res", "ab-br"];
          B.forEach(function (v, i) { OLD7.push("ab-bi" + i, "ab-bt" + i, "ab-bv" + i); });
          OLD7.forEach(function (id) { tl.set("#" + id, { autoAlpha: 0 }, RESET7); });
          tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut", immediateRender: false }, BACK7);

          // The new res list is two tiles wide: 2 and 4, the only values the if lets through.
          var C = [2, 4], FROM = [3, 4];
          buildRow("ab-c", C, TYB, true);
          // a ring walks the source list so it is clear which element is being tested
          walker("ab-sb", "ab-ring", X0, TYA, TW, TH);
          function scan(i, at) {
            if (i === 0) ringOn("#ab-sb", 0, at);
            else ringTo("#ab-sb", (i - 1) * (TW + GAP), i * (TW + GAP), at);
            bump(["#ab-at" + i, "#ab-av" + i], at);
          }
          // An even value lifts off its own tile and travels down into the res list.
          function fly(k, i, v, at) {
            var g = glyphs(v, true)[0], id = "ab-f" + k;
            add(id, "ab-dig", "left: " + (X0 + i * (TW + GAP) + g.x * TW) + "px; top: " + (TYA + g.y * TH) +
              "px; width: " + (g.w * TW) + "px; height: " + (g.h * TH) +
              "px; background-image: url(\"assets/dig-" + g.d + ".png\");");
            var s = "#" + id, land = at + 0.75;
            tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, at);
            tl.fromTo(s, { x: 0, y: 0 }, { x: (k - i) * (TW + GAP), y: TYB - TYA, duration: 0.75, ease: "power2.inOut", immediateRender: false }, at);
            tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, land);
            tl.fromTo("#ab-cv" + k, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, land);
            tl.fromTo("#ab-cv" + k, { scaleX: 1.2, scaleY: 0.78 }, { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1, 0.5)", immediateRender: false }, land);
            tl.fromTo("#ab-ct" + k, { scaleX: 1, scaleY: 1 }, { scaleX: 1.1, scaleY: 0.88, duration: 0.08, ease: "power2.out", immediateRender: false }, land);
            tl.fromTo("#ab-ct" + k, { scaleX: 1.1, scaleY: 0.88 }, { scaleX: 1, scaleY: 1, duration: 0.55, ease: "elastic.out(1, 0.5)", immediateRender: false }, land + 0.08);
          }

          // the ring tests 5, 7 and 1 and moves on; 2 and 4 pass and drop into res
          var SCAN = [[88.0, 89.0], [89.1, 90.1], [90.2, 91.2], [91.3, 93.5], [93.6, 95.8]];
          SCAN.forEach(function (t, i) { scan(i, t[0]); });
          ringOff("#ab-sb", SCAN[SCAN.length - 1][1]);
          var LAND = [91.6, 93.9];
          C.forEach(function (v, k) {
            rain("ab-ct" + k, LAND[k]);
            fly(k, FROM[k], v, LAND[k] + 0.5);
            pop("ab-ci" + k, LAND[k] + 1.35);
          });
          // the variable and its arrow follow the finished list, never lead it
          function showVar(at) {
            ["#ab-res", "#ab-br"].forEach(function (sel) {
              tl.fromTo(sel, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power1.out", immediateRender: false }, at);
            });
          }
          function hideVar(at) {
            ["#ab-res", "#ab-br"].forEach(function (sel) {
              tl.fromTo(sel, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.35, ease: "power1.inOut", immediateRender: false }, at);
            });
          }
          showVar(95.6);


          // A result row is swapped for the next one: the old tiles leave, the new ones are
          // filled from the source list exactly as before.
          function clearRow(p, n, at) {
            for (var i = 0; i < n; i++) {
              ["i", "t", "v"].forEach(function (k) {
                tl.fromTo("#" + p + k + i, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power1.inOut", immediateRender: false }, at + i * 0.08);
              });
            }
          }
          // one pass of the source list: every element is ringed, the ones that pass drop into res
          function pass(p, values, from, steps, t0) {
            var at = t0, k = 0;
            A.forEach(function (v, i) {
              var keep = from.indexOf(i) >= 0, hold = keep ? 1.6 : 1.0;
              scan(i, at);
              if (keep) {
                rain(p + "t" + k, at + 0.2);
                fly2(p, k, i, v, at + 0.6);
                pop(p + "i" + k, at + 1.4);
                k++;
              }
              at += hold;
            });
            return at;
          }
          // the same flight as part 7, for any result row
          function fly2(p, k, i, v, at) {
            var g = glyphs(v, true)[0], id = p + "f" + k;
            add(id, "ab-dig", "left: " + (X0 + i * (TW + GAP) + g.x * TW) + "px; top: " + (TYA + g.y * TH) +
              "px; width: " + (g.w * TW) + "px; height: " + (g.h * TH) +
              "px; background-image: url(\"assets/dig-" + g.d + ".png\");");
            var sel = "#" + id, land = at + 0.75;
            tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, at);
            tl.fromTo(sel, { x: 0, y: 0 }, { x: (k - i) * (TW + GAP), y: TYB - TYA, duration: 0.75, ease: "power2.inOut", immediateRender: false }, at);

          C26.forEach(function (t, i) {

          add("ab-lbl2", "ab-t", "left: " + (X0 - 296) + "px; top: " + (TY2 + TH / 2 - 29) + "px; width: 160px; text-align: right; font-size: 46px; line-height: 58px;", "lst2");
          add("ab-lbl3", "ab-t", "left: " + (X26 - 296) + "px; top: " + (TY3C + TH6 / 2 - 29) + "px; width: 160px; text-align: right; font-size: 46px; line-height: 58px;", "res");
          mkArrow3("ab-q1", TY1 + Math.round(TH / 2), X0);
          mkArrow3("ab-q2", TY2 + Math.round(TH / 2), X0);
          mkArrow3("ab-q3", TY3C + Math.round(TH6 / 2), X26);

          // each row is built the way every list in this video has been, and named once it is done

          tl.set("#ab-lbl3", { autoAlpha: 1 }, 589.4);

          // ---- Part 28: zip takes one value from each list at the same position ----

          walker("ab-z2b", "ab-ring", X0, TY2, TW, TH, RGZ);
