<!DOCTYPE html>

  <head>

  <body>
    <template id="code-window-template">
      <style>
        #root {
          /* the whole window sits a little smaller on the frame, anchored at its top left */
          transform: scale(0.66);
          transform-origin: 49px 105px;
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          /* The approved code colours (video-5-part2, the user's reference frame). */
          --cw-default: #ffffff;   /* the same white as the output window, so lst and res read clearly */
          --cw-keyword: #c099ff;
          --cw-string: #e0c78b;
          --cw-number: #f5a97f;
          --cw-builtin: #8fb3ff;
          --cw-comment: #8c8c8c;
        }
        .cw-stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
        .cw-win { position: absolute; left: 0; top: 0; width: 856px; height: 541px; opacity: 0; transform-origin: 0 0; }
        .cw-svg { position: absolute; left: 0; top: 0; overflow: visible; }
        .cw-titlebar { position: absolute; left: 22px; top: 11.2px; width: 245.5px; height: 37.6px; }
        /* Code panel at (8, 63); 20px / 16px inner padding; 36px text on a 46px grid. */
        /* the line the loop is standing on while the trace is being written */
        .cw-hl {
          position: absolute; left: -10px; opacity: 0;
          background: rgba(143, 179, 255, 0.24);
          border-left: 6px solid #a8c4ff; border-radius: 6px;
        }
        .cw-code {
          position: absolute;
          left: 28px;
          top: 79px;
          font-family: "JetBrains Mono", Consolas, monospace;
          font-weight: 400;
          font-size: 52px;
          line-height: 66px;
          color: var(--cw-default);
          font-variant-ligatures: none; /* "==" must read as two equals signs */
        }
        .cw-line { position: absolute; left: 0; height: 46px; white-space: pre; }
        .cw-kw { color: var(--cw-keyword); }
        .cw-str { color: var(--cw-string); font-style: italic; }
        .cw-num { color: var(--cw-number); }
        .cw-bi { color: var(--cw-builtin); }
        .cw-com, .cw-comment span { color: var(--cw-comment); }
      </style>

      <div data-hf-id="hf-bjih" id="root" data-composition-id="code-window" data-width="1920" data-height="1080" data-duration="672">
        <div data-hf-id="hf-lzc7" id="cw-stage" class="cw-stage" data-layout-allow-overflow="true">
          <div data-hf-id="hf-8cnz" id="cw-win" class="cw-win" data-layout-allow-overflow="true">
            <svg data-hf-id="hf-kr93" id="cw-svg" class="cw-svg" width="856" height="541" xmlns="http://www.w3.org/2000/svg">
              <defs data-hf-id="hf-mh0t">
                <clippath data-hf-id="hf-wlca" id="cw-clip"><rect data-hf-id="hf-ojxc" id="cw-clip-rect" x="0" y="0" width="856" height="541" rx="20" /></clippath>
              </defs>
              <rect data-hf-id="hf-yhl5" id="cw-outline" x="-17" y="-17" width="890" height="575" rx="37" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 13" />
              <rect data-hf-id="hf-l2bh" id="cw-body" x="0" y="0" width="856" height="541" rx="20" fill="#101b2c" />
              <g data-hf-id="hf-q2we" clip-path="url(#cw-clip)">
                <rect data-hf-id="hf-rify" id="cw-title" x="0" y="0" width="856" height="60" fill="#1b2536" />
                <rect data-hf-id="hf-pp9u" id="cw-sep" x="0" y="59" width="856" height="1.5" fill="#2a3649" />
              </g>
              <rect data-hf-id="hf-i1qo" id="cw-panel" x="8" y="63" width="840" height="470" rx="10" fill="#101b2c" stroke="#26344b" stroke-width="1.5" />
            </svg>
            <img data-hf-id="hf-jk6i" class="cw-titlebar" src="assets/code-titlebar.webp" alt="Traffic lights and the title Main.py">
            <div data-hf-id="hf-de22" id="cw-code" class="cw-code"></div>
          </div>
        </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          // Seconds (this slot starts at global 0).
          var POP_AT = 10.0, POP_DUR = 0.7;             // part 2: the code window pops up on the left
          var CHAR = 0.075, NEWLINE = 0.25;             // the slow typing rhythm (PPT clicks later)
          var LINE_H = 66, BLANK_H = 33, CW = 31.2;     // one column = 31.2px at 52px
          var PUSH_DUR = 0.4;                           // a new line pushes the lines below it down

          // Top of a line with `code` code lines and `blank` half-height blank lines above it.
          function rowTop(code, blank) { return code * LINE_H + blank * BLANK_H; }
          // Window pose for `cols` columns and `code` + `blank` lines, at (x, y); y null = centred
          // vertically. Sized from part 1's content when it arrives.
          function pose(cols, code, blank, x, y) {
            var pw = Math.ceil(cols * CW + 40), ph = rowTop(code, blank) + 32;
            var bh = ph + 71;
            return { x: x, y: y == null ? 540 - bh / 2 : y, bw: pw + 16, bh: bh, pw: pw, ph: ph };
          }
          var TYPE_AT = 10.9;                           // ... and lst = [5, 7, 1, 2, 4] types in
          // Part 2's pose: one line of 21 columns, at the top left (outline 32px from the edge,
          // its top level with the index row of the list on the right). The window is as large as
          // the space beside the lists allows, so the code reads from the back of the room.
          var P1 = pose(21, 1, 0, 49, 105);

          var D = "", K = "cw-kw", S = "cw-str", N = "cw-num", B = "cw-bi", C = "cw-com";
          var tl = gsap.timeline({ paused: true });
          var code = document.getElementById("cw-code");

          function addLine(tokens, top) {
            var line = document.createElement("div");
            line.className = "cw-line";
            line.style.top = top + "px";
            code.appendChild(line);
            var chars = [];
            tokens.forEach(function (tok) {
              for (var i = 0; i < tok[1].length; i++) {
                var span = document.createElement("span");
                if (tok[0]) span.className = tok[0];
                span.textContent = tok[1].charAt(i);
                line.appendChild(span);
                chars.push(span);
              }
            });
            return { el: line, chars: chars };
          }
          function reveal(span, at) {
            tl.fromTo(span, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: "none" }, at);
          }
          // Type characters left to right; indentation is skipped. Returns the next time.
          function typeChars(chars, at) {
            var leading = true;
            chars.forEach(function (span) {
              if (leading && span.textContent === " ") return;
              leading = false;
              reveal(span, at);
              at += CHAR;
            });
            return at;
          }
          // One line. An assignment types its value first, then "=", then the name (10, =, a).
          function typeLine(line, at) {
            var text = line.chars.map(function (s) { return s.textContent; }).join("");
            var m = /^(\s*)([A-Za-z_][\w.]*(?:, [A-Za-z_][\w.]*)*) = (?!=)/.exec(text);
            if (!m) return typeChars(line.chars, at);
            var lhsEnd = m[1].length + m[2].length, rhsAt = m[0].length;
            at = typeChars(line.chars.slice(rhsAt), at);
            at = typeChars(line.chars.slice(lhsEnd, rhsAt), at);
            return typeChars(line.chars.slice(m[1].length, lhsEnd), at);
          }
          // Type code lines (token rows; null = a half-height blank line) from `top`.
          function typeLines(rows, top, at) {
            var lines = [];
            rows.forEach(function (tokens) {
              if (tokens) {
                var line = addLine(tokens, top);
                lines.push(line);
                at = typeLine(line, at);
                top += LINE_H;
              } else {
                top += BLANK_H;
              }
              at += NEWLINE;
            });
            lines.end = at;
            return lines;
          }
          // The window's vector chrome at a pose, and a reshape (and move) between two poses.
          function chrome(p) {
            return {
              "cw-outline": { width: p.bw + 34, height: p.bh + 34 },
              "cw-body": { width: p.bw, height: p.bh },
              "cw-clip-rect": { width: p.bw, height: p.bh },
              "cw-title": { width: p.bw },
              "cw-sep": { width: p.bw },
              "cw-panel": { width: p.pw, height: p.ph },
            };
          }
          function resizeWin(from, to, at, dur) {
            var a = chrome(from), b = chrome(to);
            Object.keys(a).forEach(function (id) {
              tl.fromTo("#" + id, { attr: a[id] }, { attr: b[id], duration: dur, ease: "power2.inOut", immediateRender: false }, at);
            });
            if (from.x !== to.x || from.y !== to.y) {
              tl.fromTo("#cw-win", { x: from.x, y: from.y }, { x: to.x, y: to.y, duration: dur, ease: "power2.inOut", immediateRender: false }, at);
            }
          }

          // Baseline pose (hidden in CSS until the pop), then the pop-up.
          tl.set("#cw-win", { x: P1.x, y: P1.y }, 0);
          var base = chrome(P1);
          Object.keys(base).forEach(function (id) { tl.set("#" + id, { attr: base[id] }, 0); });
          tl.fromTo("#cw-stage", { scale: 0.3 }, { scale: 1, duration: POP_DUR, ease: "back.out(1.3)" }, POP_AT);
          tl.fromTo("#cw-win", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, POP_AT);

          // the window pops about its own centre, not the frame's
          document.getElementById("cw-stage").style.transformOrigin =
            (P1.x + P1.bw / 2) + "px " + (P1.y + P1.bh / 2) + "px";

          // ---- Part 2: the list is written in code ----
          var lstLine = typeLines([
            [[D, "lst = ["], [N, "5"], [D, ", "], [N, "7"], [D, ", "], [N, "1"], [D, ", "], [N, "2"], [D, ", "], [N, "4"], [D, "]"]],
          ], 0, TYPE_AT);

          // ---- Part 3: the for loop that squares each element ----
          // The teacher's order (his own words): the loop first, then the list to collect into,
          // which is written ABOVE the loop, and finally the append inside it.
          var P2 = pose(21, 2, 1, 49, 105), P3 = pose(21, 3, 1, 49, 105), P4 = pose(21, 4, 1, 49, 105);
          var FOR_AT = 24.1, RES_AT = 26.4, APP_AT = 28.2;

          // "normal for loop ... if we say for i in lst" - i is each element, not an index
          resizeWin(P1, P2, 23.5, PUSH_DUR);
          var forLine = typeLines([
            [[K, "for "], [D, "i "], [K, "in "], [D, "lst:"]],
          ], rowTop(1, 1), FOR_AT);

          // "I need to store this inside a list. Which list?" - res = [] goes in above the loop,
          // so the loop moves down a line as room is made for it.
          resizeWin(P2, P3, 25.8, PUSH_DUR);
          tl.fromTo(forLine[0].el, { y: 0 }, { y: LINE_H, duration: PUSH_DUR, ease: "power2.inOut", immediateRender: false }, 25.8);
          var resLine = typeLines([
            [[D, "res = []"]],
          ], rowTop(1, 1), RES_AT);

          // "how do I put this inside? ... dot append ... and inside append, i into i"
          resizeWin(P3, P4, 27.6, PUSH_DUR);
          var appLine = typeLines([
            [[D, "    res."], [B, "append"], [D, "(i*i)"]],
          ], rowTop(3, 1), APP_AT);

          // ---- Part 5: the result is printed ----
          var P5 = pose(21, 5, 2, 49, 105), PRINT_AT = 38.0;
          resizeWin(P4, P5, 37.4, PUSH_DUR);
          var printLine = typeLines([
            [[B, "print"], [D, "(res)"]],
          ], rowTop(4, 2), PRINT_AT);

          // ---- Part 6: the same thing as a list comprehension ----
          // "Rather than writing four lines, we can write it in one." The loop and the append
          // leave, and the comprehension is built inside the square brackets that are already
          // there - in the teacher's order: the brackets, then the same for loop inside them,
          // then the operation (i into i) at the front.
          var FADE_AT = 43.5, CLOSE_AT = 44.3;
          var LOOP_IN_AT = 45.2, WIDE_AT = 46.6, SQ_AT = 47.1;
          var P6 = pose(21, 3, 2, 49, 105), P7 = pose(24, 3, 2, 49, 105);

          // the two loop lines go; the print closes up behind them
          [forLine[0].el, appLine[0].el].forEach(function (el) {
            tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.inOut", immediateRender: false }, FADE_AT);
          });
          resizeWin(P5, P6, CLOSE_AT, PUSH_DUR);
          tl.fromTo(printLine[0].el, { y: 0 }, { y: -2 * LINE_H, duration: PUSH_DUR, ease: "power2.inOut", immediateRender: false }, CLOSE_AT);

          // "whatever for loop you were writing, the same one goes inside the square bracket" -
          // the closing bracket is pushed right one column per character typed.
          var closeBr = resLine[0].chars[7];
          var loopIn = addLine([[D, "       "], [K, "for "], [D, "i "], [K, "in "], [D, "lst"]], rowTop(1, 1));
          tl.set(closeBr, { display: "inline-block" }, LOOP_IN_AT);
          var loopChars = loopIn.chars.slice(7);
          loopChars.forEach(function (sp, k) {
            reveal(sp, LOOP_IN_AT + k * CHAR);
            tl.set(closeBr, { x: (k + 1) * CW }, LOOP_IN_AT + k * CHAR);
          });

          // "what is the operation? i into i - that comes right at the front, and it appends
          // by itself." Room is made for it first, then it is typed.
          resizeWin(P6, P7, WIDE_AT, PUSH_DUR);
          var sqIn = addLine([[D, "       i*i "]], rowTop(1, 1));
          var sqChars = sqIn.chars.slice(7);
          sqChars.forEach(function (sp, k) {
            reveal(sp, SQ_AT + k * CHAR);
            tl.set(loopIn.el, { x: (k + 1) * CW }, SQ_AT + k * CHAR);
            tl.set(closeBr, { x: (loopChars.length + k + 1) * CW }, SQ_AT + k * CHAR);
          });

          // ---- Part 7: the same window comes back for the even-numbers program ----
          // Everything the squares lesson wrote is dropped while the frame is dark, the window
          // is snapped back to its one-line pose, and only `lst = [5, 7, 1, 2, 4]` is left.
          function setWin(pp, at) {
            var c = chrome(pp);
            Object.keys(c).forEach(function (id) { tl.set("#" + id, { attr: c[id] }, at); });
            tl.set("#cw-win", { x: pp.x, y: pp.y }, at);
          }
          var RESET_AT = 73.9, BACK_AT = 74.8;
          [resLine[0].el, forLine[0].el, appLine[0].el, printLine[0].el, loopIn.el, sqIn.el]
            .forEach(function (el) { tl.set(el, { autoAlpha: 0 }, RESET_AT); });
          setWin(P1, RESET_AT);
          tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut", immediateRender: false }, BACK_AT);

          // The teacher's order again: the list to collect into, the loop, the append - and the
          // if condition goes in last, which pushes the append down a line and indents it.
          var Q2 = pose(21, 2, 1, 49, 105), Q3 = pose(21, 3, 1, 49, 105), Q4 = pose(21, 4, 1, 49, 105);
          var Q5 = pose(21, 5, 1, 49, 105), Q6 = pose(21, 6, 2, 49, 105);
          var RES7_AT = 76.4, FOR7_AT = 78.6, APP7_AT = 80.9, IF7_AT = 83.6;

          resizeWin(P1, Q2, RES7_AT - 0.7, PUSH_DUR);
          var res7 = typeLines([[[D, "res = []"]]], rowTop(1, 1), RES7_AT);

          resizeWin(Q2, Q3, FOR7_AT - 0.7, PUSH_DUR);
          var for7 = typeLines([[[K, "for "], [D, "i "], [K, "in "], [D, "lst:"]]], rowTop(2, 1), FOR7_AT);

          resizeWin(Q3, Q4, APP7_AT - 0.7, PUSH_DUR);
          var app7 = typeLines([[[D, "    res."], [B, "append"], [D, "(i)"]]], rowTop(3, 1), APP7_AT);

          // "Did we write one if condition or not? Yes." - it is written between the for and the
          // append, so the append slides down and one indent further in.
          resizeWin(Q4, Q5, IF7_AT - 0.8, PUSH_DUR);
          tl.fromTo(app7[0].el, { x: 0, y: 0 }, { x: 4 * CW, y: LINE_H, duration: PUSH_DUR, ease: "power2.inOut", immediateRender: false }, IF7_AT - 0.8);
          var if7 = typeLines([[[K, "    if"], [D, "(i%2=="], [N, "0"], [D, "):"]]], rowTop(3, 1), IF7_AT);

          var PRINT7_AT = 96.6;
          resizeWin(Q5, Q6, PRINT7_AT - 0.7, PUSH_DUR);
          var print7 = typeLines([[[B, "print"], [D, "(res)"]]], rowTop(5, 2), PRINT7_AT);

          // ---- Part 8: the same thing as a list comprehension, with the condition on the end ----
          // "First of all list comprehension means what should we do? Square bracket." The
          // brackets of `res = []` are already there, so the loop, the value and the condition
          // are written into them in that order.
          var FADE8_AT = 102.0, CLOSE8_AT = 102.8;
          var LOOP8_AT = 104.0, VAL8_AT = 106.2, IF8_AT = 107.6;
          var Q7 = pose(21, 3, 2, 49, 105), Q8 = pose(33, 3, 2, 49, 105);

          [for7[0].el, if7[0].el, app7[0].el].forEach(function (el) {
            tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.inOut", immediateRender: false }, FADE8_AT);
          });
          resizeWin(Q6, Q7, CLOSE8_AT, PUSH_DUR);
          tl.fromTo(print7[0].el, { y: 0 }, { y: -3 * LINE_H, duration: PUSH_DUR, ease: "power2.inOut", immediateRender: false }, CLOSE8_AT);

          // "after this obviously we need to write the for loop ... inside this"
          var close8 = res7[0].chars[7];
          tl.set(close8, { display: "inline-block" }, LOOP8_AT);
          var loop8 = addLine([[D, "       "], [K, "for "], [D, "i "], [K, "in "], [D, "lst"]], rowTop(1, 1));
          var loop8c = loop8.chars.slice(7);
          loop8c.forEach(function (sp, k) {
            reveal(sp, LOOP8_AT + k * CHAR);
            tl.set(close8, { x: (k + 1) * CW }, LOOP8_AT + k * CHAR);
          });

          // "What value do we want? I value. So I will write that particular I value."
          var val8 = addLine([[D, "       i "]], rowTop(1, 1));
          var val8c = val8.chars.slice(7);
          val8c.forEach(function (sp, k) {
            reveal(sp, VAL8_AT + k * CHAR);
            tl.set(loop8.el, { x: (k + 1) * CW }, VAL8_AT + k * CHAR);
            tl.set(close8, { x: (loop8c.length + k + 1) * CW }, VAL8_AT + k * CHAR);
          });

          // "But do we want all the elements or only few elements? ... Same if condition should
          // be written over here" - after the for loop, on the end. The window grows for it.
          // the line is longer than the room beside the lists, so the window scales to fit
          tl.set("#cw-stage", { transformOrigin: P1.x + "px " + P1.y + "px" }, IF8_AT - 1.0);
          tl.fromTo("#cw-stage", { scale: 1 }, { scale: 0.8, duration: PUSH_DUR, ease: "power2.inOut", immediateRender: false }, IF8_AT - 0.7);
          resizeWin(Q7, Q8, IF8_AT - 0.7, PUSH_DUR);
          var if8 = addLine([[D, "                      "], [K, "if"], [D, "(i%2=="], [N, "0"], [D, ")"]], rowTop(1, 1));
          var if8c = if8.chars.slice(22);
          if8c.forEach(function (sp, k) {
            reveal(sp, IF8_AT + k * CHAR);
            tl.set(close8, { x: (loop8c.length + val8c.length + k + 2) * CW }, IF8_AT + k * CHAR);
          });

          // ---- Part 9: the same comprehension, asking for the odd values instead ----
          // Only the operator changes: i%2==0 becomes i%2!=0, so the one character is swapped
          // in place and the row on the right is filled again.
          var ODD_AT = 118.0, EVEN_AT = 147.0, OR_AT = 148.5;
          var eqCh = if8.chars[28], parenCh = if8.chars[31];
          var notLine = addLine([[D, "                            !"]], rowTop(1, 1));
          var notCh = notLine.chars[28];
          tl.set(notCh, { autoAlpha: 0 }, 0);   // it only exists for the swap
          function swap(outCh, inCh, at) {
            tl.fromTo(outCh, { autoAlpha: 1, scale: 1, transformOrigin: "50% 60%" },
                             { autoAlpha: 0, scale: 0.4, duration: 0.22, ease: "power2.in", immediateRender: false }, at);
            tl.fromTo(inCh, { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 60%" },
                            { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, at + 0.2);
          }
          tl.set(eqCh, { display: "inline-block" }, ODD_AT);
          tl.set(notCh, { display: "inline-block" }, ODD_AT);
          swap(eqCh, notCh, ODD_AT);

          // ---- Part 10: the teacher's own list, back to even, and an "or" on the end ----
          // "Include any numbers they provided" - line 1 is rewritten with all eight values,
          // and the list on the right is rebuilt to match.
          tl.fromTo(lstLine[0].el, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.inOut", immediateRender: false }, 135.5);
          var lst8 = typeLines([
            [[D, "lst = ["], [N, "5"], [D, ", "], [N, "3"], [D, ", "], [N, "1"], [D, ", "], [N, "2"], [D, ", "],
             [N, "4"], [D, ", "], [N, "6"], [D, ", "], [N, "8"], [D, ", "], [N, "9"], [D, "]"]],
          ], 0, 136.3);

          swap(notCh, eqCh, EVEN_AT);

          // " ... or i%3==0" is written inside the bracket, so the ) and the ] are pushed right
          tl.set(parenCh, { display: "inline-block" }, OR_AT);
          var orLine = addLine([[D, "                                or "], [D, "i%3=="], [N, "0"]], rowTop(1, 1));
          var orCh = orLine.chars.slice(31);
          orCh.forEach(function (sp, k) {
            reveal(sp, OR_AT + k * CHAR);
            tl.set(parenCh, { x: (k + 1) * CW }, OR_AT + k * CHAR);
            tl.set(close8, { x: (25 + k + 1) * CW }, OR_AT + k * CHAR);
          });
          var Q9 = pose(43, 3, 2, 49, 105);
          tl.fromTo("#cw-stage", { scale: 0.8 }, { scale: 0.92, duration: PUSH_DUR, ease: "power2.inOut", immediateRender: false }, OR_AT - 0.7);
          resizeWin(Q8, Q9, OR_AT - 0.7, PUSH_DUR);



          // ---- The lesson clears away so the practice question has the frame ----
          tl.fromTo("#root", { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "power1.inOut", immediateRender: false }, 62.0);

          // ---- Part 12: the value, or a zero in its place ----
          // The window is cleared back to its one-line pose while the lists are being rebuilt,
          // and comes back with the original five-value list on line 1.
          var RESET12 = 180.0, BACK12 = 196.5;
