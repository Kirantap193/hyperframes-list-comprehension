<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>output panel</title>
  </head>
  <body>
    <template id="output-panel-template">
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        /* Two panels drawn on the user's own framed artwork (assets/panel.webp), nine-sliced so
           the glowing border keeps its thickness at any size: first every pair the two lists
           make, then the trace the nested loop writes as it runs. */
        .op-frame {
          position: absolute; opacity: 0;
          background: #6e3f1c; background-clip: padding-box;
          border: 34px solid transparent;
          border-image: url("assets/panel-brown.webp") 70 fill stretch;
        }
        .op-row {
          position: absolute; text-align: center; white-space: pre;
          font-family: "JetBrains Mono", Consolas, monospace; font-weight: 400;
          color: #e7d6c1; font-size: 54px; line-height: 60px;
          text-shadow: 0 3px 0 #592f12, 0 5px 0 #431f09, 0 8px 12px rgba(0, 0, 0, 0.5);
        }
        /* the trace reads in the coding window's own colours, laid out in columns */
        .tr-cell {
          position: absolute; white-space: pre; text-align: center;
          font-family: "JetBrains Mono", Consolas, monospace; font-weight: 400;
          color: #f5e2c8; font-size: 36px; line-height: 38px;
          text-shadow: 0 2px 0 #592f12, 0 3px 0 #431f09, 0 4px 6px rgba(0, 0, 0, 0.42);
        }
        .tr-hdr { color: #f0a830; }
        .tr-num { color: #f5e2c8; }
        .tr-arr { color: #f0a830; }
        /* the header strip and the raised plate each traced step sits on */
        .tr-strip {
          position: absolute; opacity: 0; border-radius: 14px;
          background: linear-gradient(180deg, #9d6130 0%, #7c4820 100%);
          box-shadow: inset 0 1px 0 rgba(255, 232, 198, 0.30), 0 2px 5px rgba(0, 0, 0, 0.35);
        }
        .tr-plate {
          position: absolute; opacity: 0; border-radius: 12px;
          background: linear-gradient(180deg, #7d4923 0%, #663818 100%);
          box-shadow: inset 0 1px 0 rgba(255, 228, 192, 0.16), 0 2px 4px rgba(0, 0, 0, 0.30);
        }
        .tr-div { position: absolute; opacity: 0; width: 2px; background: rgba(255, 220, 180, 0.22); }
      </style>

      <div data-hf-id="hf-9s8c" id="root" data-composition-id="output-panel" data-width="1920" data-height="1080" data-duration="659"></div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          var root = document.getElementById("root");
          var tl = gsap.timeline({ paused: true });

          // Both panels are the same size, so the first simply travels to where the second
          // will stand. Their children sit inside the frame's 34px border.
          var W = 640, H = 620, IW = W - 68, IH = H - 68;
          var FROM = [110, 155], TO = [1150, 396], TH2 = 674;
          var PWID = 380, PIW = PWID - 68;   // wide enough for "(2, 5)" and no more

          function frame(id, at, hh, ww) {
            var d = document.createElement("div");
            d.id = id;
            d.className = "op-frame";
            d.style.cssText = "left: " + at[0] + "px; top: " + at[1] + "px; width: " + (ww || W) + "px; height: " + (hh || H) + "px;";
            root.appendChild(d);
            return d;
          }
          function row(parent, cls, css, tokens) {
            var d = document.createElement("div");
            d.className = cls;
            d.style.cssText = css;
            parent.appendChild(d);
            var chars = [];
            tokens.forEach(function (tok) {
              for (var i = 0; i < tok[1].length; i++) {
                var s = document.createElement("span");
                if (tok[0]) s.className = tok[0];
                s.textContent = tok[1].charAt(i);
                d.appendChild(s);
                chars.push(s);
              }
            });
            return { el: d, chars: chars };
          }

          // ---- Part 22: every pair the two lists make ----
          var PAIRS = ["(2, 5)", "(2, 4)", "(2, 1)", "(4, 5)", "(4, 2)", "(4, 1)",
                       "(5, 4)", "(5, 2)", "(5, 1)"];
          var panel = frame("op-panel", FROM, 646, PWID);
          var rows = PAIRS.map(function (text, k) {
            return row(panel, "op-row", "left: 0; top: " + (14 + k * 60) + "px; width: " + PIW + "px;", [[null, text]]);
          });

          var PANEL_AT = 465.0, LIST_AT = 466.2, MOVE_AT = 473.8;
          tl.fromTo(panel, { opacity: 0, scale: 0.88, transformOrigin: "0% 0%" },
                           { opacity: 1, scale: 1, duration: 0.65, ease: "back.out(1.5)" }, PANEL_AT);

          var at = LIST_AT;
          rows.forEach(function (r) {
            r.chars.forEach(function (sp, i) {
              tl.fromTo(sp, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: "none" }, at + i * 0.05);
            });
            at += r.chars.length * 0.05 + 0.22;
          });

          // it holds where it is and then fades out
          tl.fromTo(panel, { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power1.inOut", immediateRender: false }, 481.0);

          // ---- Part 23: the trace the nested loop writes as it runs ----
          var STEPS = [[2, 5], [2, 4], [2, 2], [2, 1], [4, 5], [4, 4],
                       [4, 2], [4, 1], [5, 5], [5, 4], [5, 2], [5, 1]];
          var tp = frame("tr-panel", TO, TH2);
          var TIW = W - 68;
          // four columns: the index in lst1, the index in lst2, the arrow, and the pair
          var COL = [{ x: 14, w: 96 }, { x: 122, w: 96 }, { x: 226, w: 80 }, { x: 314, w: 236 }];
          // a plain block on the board - the header strip, a step's plate, or a divider
          function block(parent, cls, css) {
            var d = document.createElement("div");
            d.className = cls;
            d.style.cssText = css;
            parent.appendChild(d);
            return d;
          }
          function cell(top, col, cls, tokens) {
            return row(tp, "tr-cell " + cls, "left: " + COL[col].x + "px; top: " + top + "px; width: " + COL[col].w + "px;", tokens);
          }

          var strip = block(tp, "tr-strip", "left: 8px; top: 14px; width: " + (TIW - 16) + "px; height: 54px;");
          var divs = [118, 222].map(function (x) {
            return block(tp, "tr-div", "left: " + x + "px; top: 22px; height: 38px;");
          });
          var hdrI = cell(22, 0, "tr-hdr", [[null, "i"]]);
          var hdrJ = cell(22, 1, "tr-hdr", [[null, "j"]]);

          var trRows = STEPS.map(function (s, k) {
            var a = Math.floor(k / 4), b = k % 4, top = 76 + k * 43;
            var pl = block(tp, "tr-plate", "left: 8px; top: " + top + "px; width: " + (TIW - 16) + "px; height: 38px;");
            return {
              plate: pl,
              cells: [
                cell(top, 0, "", [["tr-num", String(a)]]),
                cell(top, 1, "", [["tr-num", String(b)]]),
                cell(top, 2, "tr-arr", [[null, "\u2192"]]),
                cell(top, 3, "", [[null, "("], ["tr-num", String(s[0])], [null, ", "],
                                  ["tr-num", String(s[1])], [null, ")"]]),
              ],
            };
          });

          tl.fromTo(tp, { opacity: 0, scale: 0.9, transformOrigin: "50% 0%" },
                        { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)", immediateRender: false }, 500.8);
          tl.fromTo(strip, { opacity: 0, scaleY: 0.5, transformOrigin: "50% 0%" },
                           { opacity: 1, scaleY: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, 501.1);
          [hdrI.el, hdrJ.el].forEach(function (e) {
            tl.fromTo(e, { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 501.3);
          });
          divs.forEach(function (d) {
            tl.fromTo(d, { opacity: 0, scaleY: 0, transformOrigin: "50% 50%" },
                         { opacity: 1, scaleY: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 501.4);
          });

          // one plate per step, in time with the rings on the tiles
          trRows.forEach(function (r, k) {
            var at = 502.0 + Math.floor(k / 4) * 5.0 + 0.6 + (k % 4) * 1.1 + 0.35;
            tl.fromTo(r.plate, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, at);
            r.cells.forEach(function (c) {
              tl.fromTo(c.el, { autoAlpha: 0, x: -18 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "power2.out" }, at);
            });
          });

          // when the condition is added, the three pairs it rejects are taken off the board
          [2, 5, 8].forEach(function (k) {
            tl.fromTo(trRows[k].plate, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.inOut", immediateRender: false }, 527.6);
            trRows[k].cells.forEach(function (c) {
              tl.fromTo(c.el, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.inOut", immediateRender: false }, 527.6);
            });
          });

          // ---- the frame clears so the comprehension can be written full size ----
          tl.fromTo("#root", { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "power1.inOut", immediateRender: false }, 538.0);

          // ---- Part 28: what zip hands the loop, one position at a time ----
          // the nested-loop board is done with, so only the new card comes back
          tl.set("#tr-panel", { autoAlpha: 0 }, 632.0);
          tl.set("#root", { opacity: 1 }, 632.1);
          var ZW = 560, ZH = 290, ZL = 60, ZT = 440;
          var zp = document.createElement("div");
          zp.id = "zp-panel";
          zp.className = "op-frame";
          zp.style.cssText = "left: " + ZL + "px; top: " + ZT + "px; width: " + ZW + "px; height: " + ZH + "px;";
          root.appendChild(zp);

          var ZIW = ZW - 68;
          var ZCOL = [{ x: 8, w: 96 }, { x: 110, w: 96 }, { x: 214, w: 74 }, { x: 296, w: 190 }];
          function zcell(top, col, cls, tokens) {
            return row(zp, "tr-cell " + cls, "left: " + ZCOL[col].x + "px; top: " + top + "px; width: " + ZCOL[col].w + "px;", tokens);
          }

          var zstrip = block(zp, "tr-strip", "left: 4px; top: 14px; width: " + (ZIW - 8) + "px; height: 54px;");
          var zdivs = [106, 210].map(function (x) {
            return block(zp, "tr-div", "left: " + x + "px; top: 22px; height: 38px;");
          });
          var zhI = zcell(22, 0, "tr-hdr", [[null, "i"]]);
          var zhJ = zcell(22, 1, "tr-hdr", [[null, "j"]]);

          var ZS = [[2, 1, "(2, 1)", "3"], [4, 3, "(4, 3)", "7"], [5, 9, "(5, 9)", "14"]];
          var zrows = ZS.map(function (t, k) {
            var top = 76 + k * 43;
            var pl = block(zp, "tr-plate", "left: 4px; top: " + top + "px; width: " + (ZIW - 8) + "px; height: 38px;");
            return {
              plate: pl,
              i: zcell(top, 0, "", [["tr-num", String(k)]]),
              j: zcell(top, 1, "", [["tr-num", String(k)]]),
              a: zcell(top, 2, "tr-arr", [[null, "\u2192"]]),
              pair: zcell(top, 3, "", [[null, "("], ["tr-num", String(t[0])], [null, ", "],
                                       ["tr-num", String(t[1])], [null, ")"]]),
              sum: zcell(top, 3, "", [["tr-num", t[3]]]),
            };
          });

          tl.fromTo(zp, { opacity: 0, scale: 0.9, transformOrigin: "50% 0%" },
                        { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)", immediateRender: false }, 632.8);
          tl.fromTo(zstrip, { opacity: 0, scaleY: 0.5, transformOrigin: "50% 0%" },
                            { opacity: 1, scaleY: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, 633.1);
          [zhI.el, zhJ.el].forEach(function (e) {
            tl.fromTo(e, { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 633.3);
          });
          zdivs.forEach(function (d) {
            tl.fromTo(d, { opacity: 0, scaleY: 0, transformOrigin: "50% 50%" },
                         { opacity: 1, scaleY: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 633.4);
          });

          // the pair each position produces, in time with the rings on the two lists
          zrows.forEach(function (r, k) {
            var at = 634.2 + k * 1.3 + 0.35;
            tl.fromTo(r.plate, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, at);
            [r.i, r.j, r.a, r.pair].forEach(function (c) {
              tl.fromTo(c.el, { autoAlpha: 0, x: -18 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "power2.out" }, at);
            });
            tl.set(r.sum.el, { autoAlpha: 0 }, 0);
          });

          // when the expression becomes i+j, the result column is written again
          zrows.forEach(function (r, k) {
            tl.fromTo(r.pair.el, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, 645.4);
            tl.fromTo(r.sum.el, { autoAlpha: 0, x: -18 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 646.6 + k * 1.1 + 0.35);
          });


          window.__timelines["output-panel"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
