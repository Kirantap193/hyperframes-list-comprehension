<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>output panel</title>
  </head>
  <body>
    <template id="output-panel-template">
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        /* Two panels drawn on the user's own framed artwork (assets/panel.webp), nine-sliced so
           the glowing border keeps its thickness at any size: first every pair the two lists
           make, then the trace the nested loop writes as it runs. */
        .op-frame {
          position: absolute; opacity: 0;
          background: #6e3f1c; background-clip: padding-box;
          border: 34px solid transparent;
          border-image: url("assets/panel-brown.webp") 70 fill stretch;
        }
        .op-row {
          position: absolute; text-align: center; white-space: pre;
          font-family: "JetBrains Mono", Consolas, monospace; font-weight: 400;
          color: #e7d6c1; font-size: 54px; line-height: 60px;
          text-shadow: 0 3px 0 #592f12, 0 5px 0 #431f09, 0 8px 12px rgba(0, 0, 0, 0.5);
        }
        /* the trace reads in the coding window's own colours, laid out in columns */
        .tr-cell {
          position: absolute; white-space: pre; text-align: center;
          font-family: "JetBrains Mono", Consolas, monospace; font-weight: 400;
          color: #f5e2c8; font-size: 36px; line-height: 38px;
          text-shadow: 0 2px 0 #592f12, 0 3px 0 #431f09, 0 4px 6px rgba(0, 0, 0, 0.42);
        }
        .tr-hdr { color: #f0a830; }
        .tr-num { color: #f5e2c8; }
        .tr-arr { color: #f0a830; }
        /* the header strip and the raised plate each traced step sits on */
        .tr-strip {
          position: absolute; opacity: 0; border-radius: 14px;
          background: linear-gradient(180deg, #9d6130 0%, #7c4820 100%);
          box-shadow: inset 0 1px 0 rgba(255, 232, 198, 0.30), 0 2px 5px rgba(0, 0, 0, 0.35);
        }
        .tr-plate {
          position: absolute; opacity: 0; border-radius: 12px;
          background: linear-gradient(180deg, #7d4923 0%, #663818 100%);
          box-shadow: inset 0 1px 0 rgba(255, 228, 192, 0.16), 0 2px 4px rgba(0, 0, 0, 0.30);
        }
        .tr-div { position: absolute; opacity: 0; width: 2px; background: rgba(255, 220, 180, 0.22); }
      </style>

      <div data-hf-id="hf-9s8c" id="root" data-composition-id="output-panel" data-width="1920" data-height="1080" data-duration="170"></div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          var root = document.getElementById("root");
          var tl = gsap.timeline({ paused: true });

          // Both panels are the same size, so the first simply travels to where the second
          // will stand. Their children sit inside the frame's 34px border.
          var W = 640, H = 620, IW = W - 68, IH = H - 68;
          var FROM = [110, 155], TO = [1150, 396], TH2 = 674;
          var PWID = 380, PIW = PWID - 68;   // wide enough for "(2, 5)" and no more

          function frame(id, at, hh, ww) {
            var d = document.createElement("div");
            d.id = id;
            d.className = "op-frame";
            d.style.cssText = "left: " + at[0] + "px; top: " + at[1] + "px; width: " + (ww || W) + "px; height: " + (hh || H) + "px;";
            root.appendChild(d);
            return d;
          }
          function row(parent, cls, css, tokens) {
            var d = document.createElement("div");
            d.className = cls;
            d.style.cssText = css;
            parent.appendChild(d);
            var chars = [];
            tokens.forEach(function (tok) {
              for (var i = 0; i < tok[1].length; i++) {
                var s = document.createElement("span");
                if (tok[0]) s.className = tok[0];
                s.textContent = tok[1].charAt(i);
                d.appendChild(s);
                chars.push(s);
              }
            });
            return { el: d, chars: chars };
          }

          // Nothing is printed on a board: res on the right is the output.

          window.__timelines["output-panel"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
